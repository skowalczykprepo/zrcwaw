# Lokalne uruchomienie calosci: baza + backend + frontend
# docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/chat
      SPRING_DATASOURCE_USERNAME: chat
      SPRING_DATASOURCE_PASSWORD: chat
      FILE_STORAGE_TYPE: local
      FILE_STORAGE_DIR: /data/files
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - file-data:/data/files
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # adres backendu widziany z PRZEGLADARKI (nie z kontenera), dlatego localhost
      API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
  file-data:
