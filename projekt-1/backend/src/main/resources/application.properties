spring.application.name=chat-backend
server.port=${SERVER_PORT:8080}

# --- Baza danych (PostgreSQL) ---
# Domyslne wartosci pasuja do bazy z docker-compose.yml; w chmurze nadpisywane zmiennymi srodowiskowymi.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chat}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Pliki multimedialne ---
# local = katalog na dysku (uruchomienie lokalne); docelowo s3 (AWS S3)
app.storage.type=${FILE_STORAGE_TYPE:local}
app.storage.local.dir=${FILE_STORAGE_DIR:./data/files}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- CORS: adresy frontendu (rozdzielone przecinkiem) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Actuator (health check dla load balancera) ---
management.endpoints.web.exposure.include=health
